# ── Handle-URL existence check (see the @handle_spa block below) ────────────
# http-context directives, so they live outside the server block. This file is
# copied to /etc/nginx/conf.d/default.conf, which the stock nginx.conf includes
# INSIDE http {} — that's what makes proxy_cache_path/map legal here.

# Cache for the existence subrequest: a popular public space must not cost a
# backend round-trip per view. 1m of keys ≈ 8k paths; TTLs are set per-status on
# the location (60s), short enough that publishing a space stops 404ing fast.
# The dir is created by the nginx MASTER (root) at startup and chowned to the
# worker user — don't run this image with a read-only rootfs without mounting it.
proxy_cache_path /var/cache/nginx/tela-handle-exists levels=1:2
                 keys_zone=tela_handle_exists:1m max_size=32m
                 inactive=10m use_temp_path=off;

# What the probe asks about: the request path with the query string AND the
# decorative 4th segment (the title slug) stripped — the page id is what
# resolves a page, so /alice/blog/42/old-title and /alice/blog/42?ref=x collapse
# onto ONE backend answer and one cache entry. Empty when the request line isn't
# an origin-form path (absolute-form request); the location below fails open on
# that rather than guessing.
map $request_uri $tela_handle_probe {
    "~^(/[A-Za-z0-9][A-Za-z0-9._-]*(?:/[A-Za-z0-9._-]+(?:/[0-9]+)?)?)"  $1;
    default                                                            "";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compress text assets on the wire. The Milkdown editor + app entry chunks
    # are ~1 MB / ~800 KB uncompressed; gzip cuts them ~3-4×, which is the bulk
    # of a cold doc's first-paint cost (the body can't render until the editor
    # chunk is down). Content-hashed /assets are immutable, so this is pure win.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript text/javascript
               application/json image/svg+xml application/wasm
               application/manifest+json;

    # Vite emits content-hashed filenames under /assets — the bytes for a given
    # URL never change, so cache hard and skip revalidation on repeat visits.
    # `^~` so this prefix beats the handle regex below (which is otherwise a
    # higher-priority match type) and keeps the immutable cache header.
    location ^~ /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;

        # nginx's mime.types knows .js but NOT .mjs, so an ES-module asset was
        # served as application/octet-stream and the browser refused it under
        # strict MIME checking for module scripts. That is exactly how pdf.js
        # ships its worker (pdf.worker.min-*.mjs), so every PDF preview lost its
        # worker in production while working fine under vite's dev server.
        # default_type only fills in where no mapping exists, so this adds .mjs
        # without replacing the inherited type map (a `types` block here would).
        location ~ \.mjs$ {
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable";
            default_type text/javascript;
            try_files $uri =404;
        }
    }

    # The bare app entry ("/", routed here by Caddy for a signed-in user).
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    # Known client-routed sections → SPA shell (HTTP 200). Mirror of the
    # top-level routes in src/routes/router.tsx — keep in sync when a new
    # top-level route is added, or that path will 404. Note: a missing resource
    # *within* a known section (e.g. /spaces/{bad-id}) still renders the SPA's
    # notFound UI client-side with a 200 (a soft-404 — unavoidable without SSR);
    # this block only fixes genuinely-unknown top-level paths below.
    location ~ ^/(login|register|verify-email|forgot-password|reset-password|settings|spaces|share|print|search|shared|graph|n|public|u|discover|ask|f)(/|$) {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    # Unified GitHub-style handle URLs: /{handle}, /{handle}/{space-slug}, and
    # /{handle}/{space-slug}/{pageId}[/{title-slug}] — a user/org public home, a
    # public space, or a page in one. Handle-shaped (slug chars incl. dots, e.g.
    # gulden.gullu) → a real file at that path (favicon.svg, …) wins via
    # `try_files $uri`; everything else goes to @handle_spa, which ASKS THE
    # BACKEND whether the thing exists before choosing 200 or 404. Genuinely junk
    # paths (not handle-shaped) fall through to the real 404 below. Defined AFTER
    # the known-routes allowlist so app routes win.
    #
    # KEEP IN SYNC with the @handle matcher in deploy/proxy/sites.caddy (and the
    # three @handle_*_bots path_regexps beside it). The 404 body here is the SPA
    # shell, so a path missing from this regex still RENDERS correctly while
    # returning 404 — it looks fine in a browser and is invisible to every test,
    # but crawlers and monitors see a dead URL.
    location ~ ^/[A-Za-z0-9][A-Za-z0-9._-]*(/[A-Za-z0-9._-]+(/[0-9]+(/[A-Za-z0-9._-]*)?)?)?$ {
        try_files $uri @handle_spa;
        add_header Cache-Control "no-cache";
    }

    # The handle SPA shell, with the soft-404 fixed. nginx can't know whether a
    # handle exists, so it used to answer 200 + app shell for EVERY handle-shaped
    # path: every typo, every renamed handle, every dead shared link and every
    # machine probe (/ai.txt) reported itself to crawlers and uptime monitors as
    # a live page — invisible in a browser, because the SPA renders a perfectly
    # nice "not found" screen either way. auth_request now asks the backend
    # (/api/public/exists/…, backend/internal/api/public_exists.go) and turns a
    # DEFINITE "no" into a real 404 — body still the SPA shell, so humans see
    # exactly the same branded screen and only the status changes.
    #
    # FAIL OPEN is the priority here, not the 404: a live public page 404ing
    # because the backend blinked is far worse than the bug being fixed. Only a
    # definite negative (403, mapped from the backend's 404 in /_handle_exists)
    # downgrades the status; a subrequest error, a timeout, a restarting or
    # absent backend, an unparseable request line — all of it lands on the 200
    # shell, exactly as before this check existed.
    location @handle_spa {
        auth_request /_handle_exists;
        # Definite "no" → real 404 with the SPA-shell body. The `=404` forces the
        # status: without it the named location's own 200 would win.
        error_page 401 403 =404 @spa_notfound;
        # Anything else that went wrong → the 200 shell.
        error_page 500 502 503 504 =200 @spa_shell;
        # Observability for a check that is invisible in a browser: the probe's
        # upstream status + cache state, e.g. "204 HIT".
        auth_request_set $tela_check_status $upstream_status;
        auth_request_set $tela_check_cache  $upstream_cache_status;
        add_header X-Tela-Handle-Check "$tela_check_status $tela_check_cache" always;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    # The existence subrequest. auth_request reads ONLY 2xx as "yes" and 401/403
    # as "no" — every other status is an error (→ 500 → the fail-open above) — so
    # the backend keeps an honest REST contract (204 exists / 404 doesn't / 500
    # couldn't tell) and the 404→403 mapping happens here.
    location = /_handle_exists {
        internal;
        # No path to ask about (absolute-form request line): fail open.
        if ($tela_handle_probe = "") { return 200; }

        # Docker's embedded DNS, resolved PER REQUEST because the upstream is a
        # variable. A literal proxy_pass hostname is resolved at config load, so
        # nginx would refuse to START whenever the backend container is down —
        # this way that case is only a 502 on the subrequest, i.e. fail open.
        # resolver_timeout is NOT covered by the proxy timeouts below and
        # defaults to 30s: without it, an image run outside a user-defined
        # Docker network (no embedded DNS at 127.0.0.11) would hang every public
        # page for half a minute before failing open.
        resolver 127.0.0.11 valid=30s ipv6=off;
        resolver_timeout 300ms;
        # Both compose shapes put the backend on the same network under this
        # name (docker-compose.yml and docker-compose.split.yml).
        set $tela_backend "backend:8080";
        proxy_pass http://$tela_backend/api/public/exists$tela_handle_probe;

        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        # Existence is not per-user; don't hand the backend session credentials
        # on a probe whose answer is shared through the cache.
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        # Explicit, SHORT timeouts: the budget for the whole check is well under
        # a second, and blowing it means the 200 shell, never a hung page.
        proxy_connect_timeout 300ms;
        proxy_send_timeout    500ms;
        proxy_read_timeout    500ms;

        proxy_cache tela_handle_exists;
        proxy_cache_key $tela_handle_probe;
        proxy_cache_valid 204 404 60s;
        # Keep serving the last good answer through a backend blip instead of
        # re-asking per request (500s are never cached — they aren't answers).
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;

        proxy_intercept_errors on;
        error_page 404 = @handle_absent;
        access_log off;
    }

    # The only "no" auth_request understands.
    location @handle_absent {
        internal;
        return 403;
    }

    # Everything else is a genuinely unknown path: serve a real static file if
    # one exists, otherwise a REAL 404. The 404 body is the SPA shell (see
    # error_page below), so humans still get the branded "Page not found" page
    # while crawlers / uptime monitors see the 404 status — no more soft-404
    # 200 shells for scanner noise and dead URLs.
    location / {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # Serve the SPA shell as the 404 body. No "=code" modifier, so nginx
    # PRESERVES the original 404 status (only the body is swapped in).
    error_page 404 @spa_notfound;
    location @spa_notfound {
        internal;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    # Same shell, kept as its own name for the FAIL-OPEN path in @handle_spa:
    # there the status is forced to 200 (`error_page … =200 @spa_shell`), so
    # reusing @spa_notfound for it would read as if a 404 were intended.
    location @spa_shell {
        internal;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }
}
