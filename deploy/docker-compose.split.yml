# tela — SPLIT topology, for hosts that already run a shared reverse proxy.
#
# Unlike docker-compose.yml (all-in-one: backend+frontend+postgres+gotenberg+
# proxy, the proxy being tela's own :443 edge), this stack has NO proxy service:
# an EXTERNAL shared edge (one Caddy per box owns :443) imports tela's routing
# (deploy/proxy/sites.caddy) and reverse-proxies to the backend/frontend
# published below on loopback host ports. gotenberg is omitted too — point
# TELA_GOTENBERG_URL at a renderer reachable on your network (it can be remote).
#
# Images are NOT built here — they're built on the deploying machine and pulled
# from the on-box registry (see docker-compose.registry.yml + docs/deploy.md).
# The image refs + pull policy are parametrized so one file serves both deploy
# paths:
#   registry (`make deploy`, default) — TELA_*_IMAGE point at the loopback
#     registry, pull_policy: always so `up` re-pulls the just-pushed tag.
#   docker-save fallback (`make deploy-offline`) — overrides TELA_*_IMAGE to the
#     bare `tela-*:latest` names it `docker load`s and sets TELA_PULL_POLICY=never.
# No `build:` here, so an accidental bare `up` never builds on-box.
#
# Host-specific config (TELA_SITE_ADDRESS, gotenberg URL, PDF render origin, RAG
# embed host, secrets) lives in deploy/.env — see deploy/.env.example. The
# backend `environment:` list below mirrors docker-compose.yml; keep them in sync
# when adding a passthrough (values themselves come from .env, not here).
name: tela

services:
  backend:
    image: ${TELA_BACKEND_IMAGE:-127.0.0.1:5000/tela-backend:latest}
    pull_policy: ${TELA_PULL_POLICY:-always}
    environment:
      TELA_PUBLIC_BASE_URL: ${TELA_PUBLIC_BASE_URL}
      TELA_SHARE_SECRET:    ${TELA_SHARE_SECRET}
      TELA_API_KEY_SECRET:  ${TELA_API_KEY_SECRET}
      # Encrypts Atlas source tokens + org SSO client secrets at rest. Unset =
      # generated on first boot and persisted in instance_settings.
      TELA_CREDENTIAL_KEY:  ${TELA_CREDENTIAL_KEY:-}
      TELA_CUSTOM_DOMAIN_TARGET: ${TELA_CUSTOM_DOMAIN_TARGET:-}
      TELA_DATABASE_URL: postgres://${TELA_PG_USER:-tela}:${TELA_PG_PASSWORD}@postgres:5432/${TELA_PG_DB:-tela}?sslmode=disable
      # gotenberg can be a remote renderer; the reader origin its Chromium loads
      # is TELA_PDF_RENDER_BASE_URL (the public canonical host when there's no CDN
      # to skip, or an internal origin otherwise). Both set in deploy/.env.
      TELA_GOTENBERG_URL:        ${TELA_GOTENBERG_URL:-http://gotenberg:3000}
      TELA_PDF_RENDER_BASE_URL:  ${TELA_PDF_RENDER_BASE_URL:-http://proxy}
      # Deck render sidecar (deck/) — Slidev markdown → slide images / PDF.
      TELA_DECK_URL:             ${TELA_DECK_URL:-http://deck:3344}
      TELA_ADMIN_USERNAME:  ${TELA_ADMIN_USERNAME:-}
      TELA_ADMIN_PASSWORD:  ${TELA_ADMIN_PASSWORD:-}
      TELA_ADMIN_EMAIL:     ${TELA_ADMIN_EMAIL:-}
      TELA_SMTP_HOST:      ${TELA_SMTP_HOST:-}
      TELA_SMTP_PORT:      ${TELA_SMTP_PORT:-}
      TELA_SMTP_TLS:       ${TELA_SMTP_TLS:-}
      TELA_SMTP_USERNAME:  ${TELA_SMTP_USERNAME:-}
      TELA_SMTP_PASSWORD:  ${TELA_SMTP_PASSWORD:-}
      TELA_SMTP_FROM:      ${TELA_SMTP_FROM:-}
      # RAG embed host. If reached over a private overlay network and resolved by
      # NAME, the name may not resolve inside this container — use the host's
      # overlay IP in TELA_RAG_EMBED_URL. See CLAUDE.md / docs/search.md.
      TELA_RAG_EMBED_URL:    ${TELA_RAG_EMBED_URL:-}
      TELA_RAG_EMBED_MODEL:  ${TELA_RAG_EMBED_MODEL:-}
      TELA_RAG_EMBED_DIM:    ${TELA_RAG_EMBED_DIM:-}
      TELA_RAG_EMBED_TOKEN:    ${TELA_RAG_EMBED_TOKEN:-}
      TELA_RAG_QUERY_INSTRUCT: ${TELA_RAG_QUERY_INSTRUCT:-}
      # Optional rerank tier + Ask-query logging (internal/rag).
      TELA_RAG_RERANK_URL:    ${TELA_RAG_RERANK_URL:-}
      TELA_RAG_RERANK_MODEL:  ${TELA_RAG_RERANK_MODEL:-}
      TELA_RAG_RERANK_TOKEN:  ${TELA_RAG_RERANK_TOKEN:-}
      TELA_RAG_LOG_ASKS:      ${TELA_RAG_LOG_ASKS:-}
      # Managed AI / "ask your docs" (internal/llm). Unset → /api/rag/ask 503s.
      # OpenAI-compatible base incl. /v1 (a remote Ollama's /v1 or any provider).
      TELA_LLM_URL:    ${TELA_LLM_URL:-}
      TELA_LLM_MODEL:  ${TELA_LLM_MODEL:-}
      TELA_LLM_TOKEN:  ${TELA_LLM_TOKEN:-}
      # Completion length cap (0/unset → in-code default 1024). Raise for long
      # table/enumeration answers that otherwise truncate mid-stream.
      TELA_LLM_MAX_TOKENS: ${TELA_LLM_MAX_TOKENS:-}
      # Foreground (ask/assist) concurrency gate + overload spill. MAX_INFLIGHT
      # caps concurrent completions on the primary (default 20); past it a request
      # waits OVERFLOW_WAIT_MS then spills to OVERFLOW_MODEL (the relief proxy's
      # tela-chat-overflow alias → L2). Background work bypasses the gate.
      TELA_LLM_MAX_INFLIGHT:     ${TELA_LLM_MAX_INFLIGHT:-}
      TELA_LLM_OVERFLOW_MODEL:   ${TELA_LLM_OVERFLOW_MODEL:-}
      TELA_LLM_OVERFLOW_WAIT_MS: ${TELA_LLM_OVERFLOW_WAIT_MS:-}
      # Optional deep-link from the admin AI-reliability card to the Grafana
      # failover dashboard. Unset → no link shown.
      TELA_GRAFANA_AI_URL: ${TELA_GRAFANA_AI_URL:-}
      # Set to 1 when a failover proxy fronts AI (auto-set by the relief overlay)
      # so the admin reliability card shows "relief pool" vs "single endpoint".
      TELA_AI_RELIEF: ${TELA_AI_RELIEF:-}
      # Deck image generation (MCP generate_deck_image) — OpenAI-compatible Images
      # endpoint incl. /v1. Unset → 503. Use the overlay IP from Docker, not a name.
      TELA_IMAGE_GEN_URL:    ${TELA_IMAGE_GEN_URL:-}
      TELA_IMAGE_GEN_MODEL:  ${TELA_IMAGE_GEN_MODEL:-}
      TELA_IMAGE_GEN_KEY:    ${TELA_IMAGE_GEN_KEY:-}
      # Self-serve billing (Polar, internal/billing). Unset TOKEN/SECRET → dark.
      # PRODUCTS maps plan keys → Polar product UUIDs ("personal_plus:<uuid>,…").
      TELA_POLAR_TOKEN:          ${TELA_POLAR_TOKEN:-}
      TELA_POLAR_WEBHOOK_SECRET: ${TELA_POLAR_WEBHOOK_SECRET:-}
      TELA_POLAR_BASE_URL:       ${TELA_POLAR_BASE_URL:-}
      TELA_POLAR_PRODUCTS:       ${TELA_POLAR_PRODUCTS:-}
      # Self-serve self-host Enterprise licensing (issuance, managed cloud only):
      # the seat-based Polar product + the vendor's private signing key. Both set →
      # sales_enabled; unset → the buyer flow stays dark. See selfhost_license.go.
      TELA_POLAR_SELFHOST_PRODUCT: ${TELA_POLAR_SELFHOST_PRODUCT:-}
      TELA_LICENSE_SIGNING_KEY:    ${TELA_LICENSE_SIGNING_KEY:-}
      TELA_WORKOS_ISSUER:    ${TELA_WORKOS_ISSUER:-}
      TELA_MCP_RESOURCE:     ${TELA_MCP_RESOURCE:-}
      WORKOS_API_KEY:        ${WORKOS_API_KEY:-}
      TELA_SSO_GOOGLE_CLIENT_ID:        ${TELA_SSO_GOOGLE_CLIENT_ID:-}
      TELA_SSO_GOOGLE_CLIENT_SECRET:    ${TELA_SSO_GOOGLE_CLIENT_SECRET:-}
      TELA_SSO_MICROSOFT_CLIENT_ID:     ${TELA_SSO_MICROSOFT_CLIENT_ID:-}
      TELA_SSO_MICROSOFT_CLIENT_SECRET: ${TELA_SSO_MICROSOFT_CLIENT_SECRET:-}
      TELA_SSO_GITHUB_CLIENT_ID:        ${TELA_SSO_GITHUB_CLIENT_ID:-}
      TELA_SSO_GITHUB_CLIENT_SECRET:    ${TELA_SSO_GITHUB_CLIENT_SECRET:-}
      # WebDAV sync surface (docs/webdav-sync.md). Default ON; empty = default.
      TELA_WEBDAV_ENABLED:         ${TELA_WEBDAV_ENABLED:-}
      TELA_WEBDAV_CREATE_SPACES:   ${TELA_WEBDAV_CREATE_SPACES:-}
      TELA_WEBDAV_DELETE_FLOOR:    ${TELA_WEBDAV_DELETE_FLOOR:-}
      TELA_WEBDAV_DELETE_FRACTION: ${TELA_WEBDAV_DELETE_FRACTION:-}
      TELA_WEBDAV_FILE_MAX_BYTES:  ${TELA_WEBDAV_FILE_MAX_BYTES:-}
      # Ops knobs (empty = default).
      TELA_LOG_FORMAT:           ${TELA_LOG_FORMAT:-}
      TELA_API_KEY_AUDIT_DAYS:   ${TELA_API_KEY_AUDIT_DAYS:-}
      TELA_DISABLE_WELCOME_SEED: ${TELA_DISABLE_WELCOME_SEED:-}
    # The external shared edge reaches the backend on loopback. Bound to
    # 127.0.0.1 so the API is never exposed on the box's public interface — only
    # the edge (which terminates TLS + applies the noindex/routing rules) is.
    ports:
      - "127.0.0.1:8781:8080"
    depends_on:
      postgres:
        condition: service_healthy
      deck:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER:     ${TELA_PG_USER:-tela}
      POSTGRES_PASSWORD: ${TELA_PG_PASSWORD}
      POSTGRES_DB:       ${TELA_PG_DB:-tela}
    volumes:
      - tela-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TELA_PG_USER:-tela} -d ${TELA_PG_DB:-tela}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  frontend:
    image: ${TELA_FRONTEND_IMAGE:-127.0.0.1:5000/tela-frontend:latest}
    pull_policy: ${TELA_PULL_POLICY:-always}
    ports:
      - "127.0.0.1:8782:80"
    restart: unless-stopped

  # Deck render sidecar (deck/) — Slidev markdown → slide images / PDF. Internal
  # only; the backend reaches it at http://deck:3344. SECURITY: it compiles deck
  # markdown, so treat as untrusted-code execution — a follow-up isolates it on
  # an egress-locked network (needs self-hosted theme fonts first).
  deck:
    image: ${TELA_DECK_IMAGE:-127.0.0.1:5000/tela-deck:latest}
    pull_policy: ${TELA_PULL_POLICY:-always}
    expose:
      - "3344"
    volumes:
      - tela-deckcache:/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3344/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Optional AI relief proxy (LiteLLM) — failover / load-balancing in front of
  # chat + embeddings so traffic shifts to a relief endpoint when the primary
  # clogs. Opt in with COMPOSE_PROFILES=relief in deploy/.env, then point
  # TELA_LLM_URL / TELA_RAG_EMBED_URL at http://litellm:4000/v1. The config is
  # RENDERED from env by gen-config.py at start, so the routing mode is fully
  # configurable: single (no fallback) | failover (only-down) | loadbalance
  # (throughput). See deploy/.env.example → "AI relief proxy". Backend reaches it
  # by service name on the default network.
  litellm:
    # Pinned by digest (litellm v1.90.1, main-stable @ 2026-06-30) so pull_policy:
    # always can't silently grab a breaking build. Bump deliberately: pull a newer
    # main-stable, verify, then paste its digest here.
    image: ghcr.io/berriai/litellm:main-stable@sha256:09d98fd0c82d1a3731577fde7fe2f65db0afa4453e9da45c11ecda94d047248f
    profiles: ["relief"]
    entrypoint: ["sh", "-c"]
    command: ["python3 /etc/litellm/gen-config.py > /tmp/litellm.yaml && exec litellm --config /tmp/litellm.yaml --port 4000"]
    volumes:
      - ./litellm/gen-config.py:/etc/litellm/gen-config.py:ro
    environment:
      # Plain :- (not :?) so a non-relief `up` never trips on it; gen-config.py
      # errors at start if it's blank.
      LITELLM_MASTER_KEY:    ${LITELLM_MASTER_KEY:-}
      TELA_AI_NUM_RETRIES:   ${TELA_AI_NUM_RETRIES:-}
      TELA_AI_ALLOWED_FAILS: ${TELA_AI_ALLOWED_FAILS:-}
      TELA_AI_COOLDOWN:      ${TELA_AI_COOLDOWN:-}
      TELA_AI_TIMEOUT:       ${TELA_AI_TIMEOUT:-}
      # Chat overflow chain: L1 (primary) → L2 → L3, cascading on failure/cooldown
      # (set TELA_LLM_MODEL = TELA_LLM_1_MODEL). Optional per-layer caps.
      TELA_LLM_1_URL:          ${TELA_LLM_1_URL:-}
      TELA_LLM_1_MODEL:        ${TELA_LLM_1_MODEL:-}
      TELA_LLM_1_KEY:          ${TELA_LLM_1_KEY:-}
      TELA_LLM_1_PROVIDER:     ${TELA_LLM_1_PROVIDER:-}
      TELA_LLM_1_MAX_PARALLEL: ${TELA_LLM_1_MAX_PARALLEL:-}
      TELA_LLM_1_RPM:          ${TELA_LLM_1_RPM:-}
      TELA_LLM_2_URL:          ${TELA_LLM_2_URL:-}
      TELA_LLM_2_MODEL:        ${TELA_LLM_2_MODEL:-}
      TELA_LLM_2_KEY:          ${TELA_LLM_2_KEY:-}
      TELA_LLM_2_PROVIDER:     ${TELA_LLM_2_PROVIDER:-}
      TELA_LLM_2_MAX_PARALLEL: ${TELA_LLM_2_MAX_PARALLEL:-}
      TELA_LLM_2_RPM:          ${TELA_LLM_2_RPM:-}
      TELA_LLM_3_URL:          ${TELA_LLM_3_URL:-}
      TELA_LLM_3_MODEL:        ${TELA_LLM_3_MODEL:-}
      TELA_LLM_3_KEY:          ${TELA_LLM_3_KEY:-}
      TELA_LLM_3_PROVIDER:     ${TELA_LLM_3_PROVIDER:-}
      TELA_LLM_3_MAX_PARALLEL: ${TELA_LLM_3_MAX_PARALLEL:-}
      TELA_LLM_3_RPM:          ${TELA_LLM_3_RPM:-}
      # Embed: single (a relief embedder must be the same 1024-d model on a 2nd host).
      TELA_EMBED_PRIMARY_URL:      ${TELA_EMBED_PRIMARY_URL:-}
      TELA_EMBED_PRIMARY_MODEL:    ${TELA_EMBED_PRIMARY_MODEL:-}
      TELA_EMBED_PRIMARY_KEY:      ${TELA_EMBED_PRIMARY_KEY:-}
      TELA_EMBED_PRIMARY_PROVIDER: ${TELA_EMBED_PRIMARY_PROVIDER:-}
    ports:
      - "${LITELLM_METRICS_BIND:-127.0.0.1:4000}:4000"
    restart: unless-stopped

  # ── Umami analytics ─────────────────────────────────────────────────────────
  # Self-hosted, privacy-friendly web analytics for the landing page.
  # Caddy reverse-proxies https://telawiki.com/analytics → http://127.0.0.1:3001.
  # First boot: log in with admin/umami, change the password, then add the site
  # and paste the tracking script into landing/src/layouts/Base.astro.
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD}@umami_db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET}
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      umami_db:
        condition: service_healthy
    networks:
      - default
      - analytics
    restart: unless-stopped

  umami_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       umami
      POSTGRES_USER:     umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD}
    volumes:
      - umami_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - analytics
    restart: unless-stopped

networks:
  analytics:
    internal: true

volumes:
  tela-pgdata:
  tela-deckcache:
  umami_db_data:
